      Explicit, itemized "3.1 Package of Services" list on the same page
      as pol-06: supplementary nutrition, pre-school non-formal
      education, nutrition & health education, immunization, health
      check-up, referral services -- page 18, clean.

  - id: pol-08
    text: "What is the role of Poshan Abhiyaan within Saksham Anganwadi and Mission Poshan 2.0?"
    expected_source: policy_pdf
    origin: mowcd_page_given
    retrievable_but_incomplete: false
    ground_truth:
