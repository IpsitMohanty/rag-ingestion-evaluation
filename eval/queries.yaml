# Totals: 11 policy_pdf + 9 either + 5 neither + 26 faq = 51 queries.
#
# All 13 of the MoWCD FAQ-page questions are folded in now (origin:
# mowcd_page_given): pol-01, pol-05, pol-06, pol-07, pol-08, pol-09,
# pol-10, pol-11 (8, policy_pdf-only), either-03, either-07, either-08,
# either-09 (4, cross-source), neither-01 (1, neither). That's fewer
# "neither" than you expected going in -- only Paanch Sutra didn't turn
# up anywhere. The ones that needed reclassifying from your original
# framing (SAM and Paanch Sutra from the first round; Saksham Anganwadi,
# stunting/wasting/underweight, and MAM landing as "either" rather than
# assumed-policy this round) are exactly the discriminating cases this
# eval is supposed to surface -- also 4 of the 11 policy_pdf entries are
# flagged retrievable_but_incomplete, i.e. the topic is genuinely in the
# PDF but the specific fact asked for isn't spelled out.
#
# origin legend:
#   mowcd_page_given     - one of the 13 MoWCD Poshan 2.0 FAQ-page questions you supplied
#                          this round. Each was independently verified against the corpus
#                          (not trusted at face value) before being placed and labeled.
#   policy_derived       - written by me directly from a verified PDF passage (page cited).
#   faq_reworded         - paraphrased from a real all_faq.json row (original_question given).
#   neither_constructed  - written by me about a real, named, adjacent scheme/concept that a
#                          direct search confirmed is absent from both corpus files.
#
# On not adding the MoWCD FAQ page's own answers to the corpus: per your
# instruction, deliberately not done. The two-source opposition (126 atomic
# FAQ pairs vs. one long policy PDF) is the experimental design; a third
# source blurs it, and these questions are more useful as external probes
# precisely because the corpus doesn't already contain their answers
# verbatim from that page.
