      WHY THIS ONE MATTERS MORE THAN A SYNTHETIC NEGATIVE: it's a real,
      well-known, domain-appropriate question -- exactly the kind of
      thing a real user of this corpus would ask, sourced from the
      ministry's own published FAQ page, not invented to be obviously
      out-of-scope. A system that confidently retrieves something and
      presents it as an answer here is failing in the way that actually
      matters (plausible-sounding wrong answer to a plausible question),
      not just failing to answer an irrelevant one. The neither set
      should skew toward more probes like this one and fewer like
      neither-02..05 below, which are real but more obviously
      out-of-domain (a different ministry's scheme entirely) by
      comparison.

