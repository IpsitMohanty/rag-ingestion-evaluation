# PROPOSED query set (v2) for phase 2's retrieval evaluation -- NOT reviewed
# yet. Do not build the harness against this file until it's been corrected.
#
# v2 changes from the first draft:
#   - folded in all 13 of the MoWCD Poshan 2.0 FAQ-page questions, each
#     independently verified against the corpus (grep the PDF, cross-check
#     data/faq/all_faq.json) rather than trusted at face value
#   - added retrievable_but_incomplete: a real gap between "the right chunk
#     was retrieved" (hit-rate says 1.0) and "the question is actually
#     answered" -- true wherever the corpus states a concept exists /
#     is referenced but doesn't spell out the specifics being asked for
#   - the MoWCD FAQ page's own answers are NOT added to the corpus, even
#     though published -- see the note at the end of the file for why
#
# Schema per entry:
#   id                        stable short id, never reused/renumbered once reviewed
#   text                       the query text
#   expected_source            faq | policy_pdf | either | neither
#   origin                     mowcd_page_given | policy_derived | faq_reworded | neither_constructed
#                              -- see legend at the bottom of this file for what each means
#   retrievable_but_incomplete (omitted for "neither" -- not applicable) true when the
#                              correct chunk(s) are genuinely retrievable but don't fully
#                              answer what was asked (concept referenced, specifics absent)
#   ground_truth               null for "neither"; otherwise one or more {source, ...} refs:
#                                {source: faq, faq_index: N}       -- N is the 0-based row index
#                                                                     in data/faq/all_faq.json
#                                {source: policy_pdf, page: N}     -- PDF page number. Page, not
#                                                                     chunk id: chunk boundaries
#                                                                     shift across the chunk_size/
#                                                                     overlap sweep, page numbers
#                                                                     don't.
#   original_question          (faq_reworded only) the stored FAQ question this was reworded
#                              from, so you can check the paraphrase kept the meaning
#   note                       caveats, especially where the corpus only partially answers
#                              the query, or where a query moved buckets from v1

queries:

  # --- policy_pdf only (11) ---

  - id: pol-01
    text: "What are the population norms and any other criteria for setting up of AWCs? Are these norms applicable across all States including North-Eastern States?"
    expected_source: policy_pdf
    origin: mowcd_page_given
    retrievable_but_incomplete: true
    ground_truth:
      - {source: policy_pdf, page: 31}
    note: >
      Page 31 references "population norms of Main AWC" as the upgrade
      criterion for a Mini-Anganwadi, but this document never states the
      actual numeric thresholds (e.g. per-400/800 population) anywhere I
      could find. Page 44 (hilly/sparse-population construction cost
      norms) is adjacent but doesn't give the norms either. The
      NE-states-applicability half of the question also isn't
      specifically addressed. Retrieval finding page 31 is a correct hit
      on topic; the chunk itself still won't fully answer the question --
      hence retrievable_but_incomplete.

  - id: pol-02
    text: "What is the minimum age and educational qualification to become an Anganwadi Worker or Helper, and what is their retirement age?"
    expected_source: policy_pdf
    origin: policy_derived
    retrievable_but_incomplete: false
    ground_truth:
      - {source: policy_pdf, page: 20}
    note: "12th standard, age 18-35 at engagement, retirement age set by the state government but capped at 65 -- page 20."

  - id: pol-03
    text: "Under which law are the Anganwadi and Poshan 2.0 scheme guidelines issued?"
    expected_source: policy_pdf
    origin: policy_derived
    retrievable_but_incomplete: false
    ground_truth:
      - {source: policy_pdf, page: 9}
    note: "National Food Security Act, 2013, Sections 4(a), 5(1)(a), 6 & 7 -- page 9."

  - id: pol-04
    text: "How many calories per day is a normal child aged 6 to 72 months entitled to receive under the scheme?"
    expected_source: policy_pdf
    origin: policy_derived
    retrievable_but_incomplete: false
    ground_truth:
      - {source: policy_pdf, page: 22}
    note: "Nutritional norms table: 500 kcal / 12-15g protein for that category -- page 22. Not covered anywhere in the FAQ set."

  - id: pol-05
    text: "How is Anganwadi Services under Mission Poshan 2.0 different from the erstwhile ICDS? What new components have been added?"
    expected_source: policy_pdf
    origin: mowcd_page_given
    retrievable_but_incomplete: true
    ground_truth:
      - {source: policy_pdf, page: 7}
      - {source: policy_pdf, page: 9}
    note: >
      No single passage does a direct "ICDS vs Poshan 2.0" comparison.
      Page 7 critiques the erstwhile ICDS-era approach (calorie-only
      focus, weak community ownership, poor last-mile tracking); page 9
      lists Poshan 2.0's reorganized components (SNP, ECCE, Anganwadi
      Infrastructure, Poshan Abhiyaan under one umbrella). Answering the
      question means synthesizing both pages, which a single retrieved
      chunk won't do -- marked incomplete even though the material is
      genuinely present.

  - id: pol-06
    text: "Who are the beneficiaries under the Anganwadi Services scheme?"
    expected_source: policy_pdf
    origin: mowcd_page_given
    retrievable_but_incomplete: false
    ground_truth:
      - {source: policy_pdf, page: 18}
    note: "Explicit list: children up to 6 years, PW&LM, and Adolescent Girls (14-18) in Aspirational Districts/NER -- page 18, clean single-chunk answer."

  - id: pol-07
    text: "What services (benefits) are provided under the Anganwadi Services scheme?"
    expected_source: policy_pdf
    origin: mowcd_page_given
    retrievable_but_incomplete: false
    ground_truth:
      - {source: policy_pdf, page: 18}
